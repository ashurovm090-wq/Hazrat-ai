 <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torch Drop — App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background: #0f1115; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .app-container {
            width: 100%; max-width: 420px; height: 100vh; max-height: 880px;
            background: #161920; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; position: relative;
        }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: #1c2029; border-bottom: 1px solid #282e3d; }
        .logo { font-weight: 800; color: #ff5500; font-size: 18px; }
        .user-panel { display: flex; align-items: center; gap: 12px; }
        .balance { background: #222733; padding: 6px 12px; border-radius: 8px; font-size: 14px; font-weight: 600; color: #40c057; }
        .username { font-size: 13px; color: #a0a5b5; font-weight: 500; }

        .main-content { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }

        .upgrade-section { background: #1c2029; padding: 16px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .slots { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .slot { width: 110px; height: 110px; background: #12141a; border: 2px dashed #282e3d; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; font-size: 11px; padding: 4px; }
        .slot.active { border-style: solid; border-color: #ff5500; background: #221c1a; }
        .slot-img { font-size: 32px; }

        .chance-badge { font-size: 20px; font-weight: 800; color: #ffab00; }
        
        .btn-upgrade { width: 100%; padding: 12px; background: #ff5500; color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-upgrade:disabled { opacity: 0.5; cursor: not-allowed; }

        .section-title { font-size: 14px; color: #717a8a; font-weight: 600; margin-bottom: 8px; }
        
        .items-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .item-card { background: #1c2029; border: 1px solid #282e3d; border-radius: 8px; padding: 8px; display: flex; flex-direction: column; align-items: center; cursor: pointer; position: relative; }
        .item-card.selected { border-color: #ff5500; background: #26211f; }
        .item-card .img { font-size: 24px; margin-bottom: 4px; }
        .item-card .name { font-size: 10px; text-align: center; color: #a0a5b5; height: 24px; overflow: hidden; }
        .item-card .price { font-size: 11px; font-weight: bold; margin-top: 4px; color: #ffab00; }
        .btn-sell { margin-top: 4px; font-size: 9px; background: #e03131; color: #fff; border: none; padding: 2px 6px; border-radius: 4px; cursor: pointer; }

        /* Модальное окно входа */
        .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .modal { background: #1c2029; padding: 24px; border-radius: 12px; width: 80%; display: flex; flex-direction: column; gap: 12px; }
        .modal input { padding: 10px; border-radius: 6px; border: 1px solid #282e3d; background: #12141a; color: #fff; }
        .modal button { padding: 10px; background: #ff5500; border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="logo">🔥 TORCH DROP</div>
        <div class="user-panel">
            <span class="username" id="userNameDisplay">...</span>
            <div class="balance" id="balanceDisplay">$0.00</div>
        </div>
    </div>

    <div class="main-content">
        <!-- Секция Апгрейда -->
        <div class="upgrade-section">
            <div class="slots">
                <div class="slot" id="mySlot">
                    <span>Выбери скин</span>
                </div>
                <div class="chance-badge" id="chanceDisplay">0%</div>
                <div class="slot" id="targetSlot">
                    <span>Выбери цель</span>
                </div>
            </div>
            <button class="btn-upgrade" id="btnUpgrade" disabled onclick="runUpgrade()">АПГРЕЙД</button>
        </div>

        <!-- Мой инвентарь -->
        <div>
            <div class="section-title">ТВОЙ ИНВЕНТАРЬ</div>
            <div class="items-grid" id="myInventoryGrid"></div>
        </div>

        <!-- Доступные цели -->
        <div>
            <div class="section-title">ЦЕЛИ ДЛЯ АПГРЕЙДА</div>
            <div class="items-grid" id="targetGrid"></div>
        </div>
    </div>

    <!-- Модалка авторизации -->
    <div class="modal-overlay" id="authModal">
        <div class="modal">
            <h3 style="text-align: center;">Вход в аккаунт</h3>
            <input type="text" id="loginInput" placeholder="Введите ваш логин...">
            <button onclick="handleLogin()">Войти / Зарегистрироваться</button>
        </div>
    </div>
</div>

<script>
    let state = {
        username: "",
        balance: 0,
        myInventory: [],
        targets: [],
        selectedMyItem: null,
        selectedTargetItem: null
    };

    async function initApp() {
        try {
            const res = await fetch('/api/init');
            if (res.status === 401) {
                document.getElementById('authModal').style.display = 'flex';
                return;
            }
            const data = await res.json();
            document.getElementById('authModal').style.display = 'none';
            
            state.username = data.username;
            state.balance = data.balance;
            state.myInventory = data.user_inventory;
            state.targets = data.target_items;

            render();
        } catch (e) {
            console.error("Ошибка загрузки:", e);
        }
    }

    async function handleLogin() {
        const username = document.getElementById('loginInput').value.trim();
        if (!username) return alert("Введите имя пользователя!");

        const res = await fetch('/api/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ username })
        });

        if (res.ok) {
            initApp();
        } else {
            const err = await res.json();
            alert(err.detail || "Ошибка входа");
        }
    }

    function render() {
        document.getElementById('userNameDisplay').innerText = state.username;
        document.getElementById('balanceDisplay').innerText = `$${state.balance.toFixed(2)}`;

        // Отрисовка инвентаря
        const myGrid = document.getElementById('myInventoryGrid');
        myGrid.innerHTML = state.myInventory.map(item => `
            <div class="item-card ${state.selectedMyItem?.id === item.id ? 'selected' : ''}" onclick="selectMyItem('${item.id}')">
                <div class="img">${item.img}</div>
                <div class="name">${item.name}</div>
                <div class="price">$${item.price}</div>
                <button class="btn-sell" onclick="sellItem(event, '${item.id}')">Продать</button>
            </div>
        `).join('');

        // Отрисовка целей
        const targetGrid = document.getElementById('targetGrid');
        targetGrid.innerHTML = state.targets.map(item => `
            <div class="item-card ${state.selectedTargetItem?.id === item.id ? 'selected' : ''}" onclick="selectTargetItem('${item.id}')">
                <div class="img">${item.img}</div>
                <div class="name">${item.name}</div>
                <div class="price">$${item.price}</div>
            </div>
        `).join('');

        // Обновление слотов и шанса
        const mySlot = document.getElementById('mySlot');
        if (state.selectedMyItem) {
            mySlot.className = "slot active";
            mySlot.innerHTML = `<div class="slot-img">${state.selectedMyItem.img}</div><div>$${state.selectedMyItem.price}</div>`;
        } else {
            mySlot.className = "slot";
            mySlot.innerHTML = `<span>Выбери скин</span>`;
        }

        const targetSlot = document.getElementById('targetSlot');
        if (state.selectedTargetItem) {
            targetSlot.className = "slot active";
            targetSlot.innerHTML = `<div class="slot-img">${state.selectedTargetItem.img}</div><div>$${state.selectedTargetItem.price}</div>`;
        } else {
            targetSlot.className = "slot";
            targetSlot.innerHTML = `<span>Выбери цель</span>`;
        }

        // Шанс
        const btn = document.getElementById('btnUpgrade');
        if (state.selectedMyItem && state.selectedTargetItem) {
            if (state.selectedTargetItem.price <= state.selectedMyItem.price) {
                document.getElementById('chanceDisplay').innerText = '0%';
                btn.disabled = true;
            } else {
                const chance = ((state.selectedMyItem.price / state.selectedTargetItem.price) * 0.95 * 100).toFixed(1);
                document.getElementById('chanceDisplay').innerText = `${chance}%`;
                btn.disabled = false;
            }
        } else {
            document.getElementById('chanceDisplay').innerText = '0%';
            btn.disabled = true;
        }
    }

    function selectMyItem(id) {
        state.selectedMyItem = state.myInventory.find(i => i.id === id);
        render();
    }

    function selectTargetItem(id) {
        state.selectedTargetItem = state.targets.find(i => i.id === id);
        render();
    }

    async function runUpgrade() {
        if (!state.selectedMyItem || !state.selectedTargetItem) return;

        const res = await fetch('/api/upgrade', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                selected_item_id: state.selectedMyItem.id,
                target_item_id: state.selectedTargetItem.id
            })
        });

        if (res.ok) {
            const data = await res.json();
            alert(data.win ? '🎉 УСПЕХ! Скин получен!' : '❌ НЕУДАЧА! Скин сгорел.');
            state.myInventory = data.updated_inventory;
            state.selectedMyItem = null;
            state.selectedTargetItem = null;
            render();
        } else {
            const err = await res.json();
            alert(err.detail);
        }
    }

    async function sellItem(e, itemId) {
        e.stopPropagation();
        const res = await fetch('/api/sell', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ item_id: itemId })
        });

        if (res.ok) {
            const data = await res.json();
            state.balance = data.new_balance;
            state.myInventory = data.updated_inventory;
            if (state.selectedMyItem?.id === itemId) {
                state.selectedMyItem = null;
            }
            render();
        }
    }

    initApp();
</script>
</body>
</html>
