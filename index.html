 <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Upgrader</title>
    <style>
        body { background: #121214; color: white; font-family: sans-serif; text-align: center; }
        .wheel-container { position: relative; width: 300px; height: 300px; margin: 30px auto; }
        .wheel {
            width: 100%; height: 100%; border-radius: 50%;
            background: conic-gradient(#ffd700 0deg var(--win-angle, 36deg), #2a2b30 var(--win-angle, 36deg) 360deg);
            transition: transform 4s cubic-bezier(0.15, 0.9, 0.15, 1);
        }
        .pointer {
            position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; 
            border-left: 12px solid transparent; border-right: 12px solid transparent;
            border-top: 20px solid #ff4757; z-index: 10;
        }
        button { padding: 12px 24px; background: #2ed573; border: none; font-weight: bold; cursor: pointer; border-radius: 6px; }
    </style>
</head>
<body>

    <h1>Skin Upgrader</h1>
    <div class="wheel-container">
        <div class="pointer"></div>
        <div class="wheel" id="wheel"></div>
    </div>

    <button onclick="spin()">Крутить (10$-> 100$)</button>
    <h2 id="result"></h2>

    <script>
        // Устанавливаем сектор победы (10% = 36 градусов)
        document.getElementById('wheel').style.setProperty('--win-angle', '36deg');

        async function spin() {
            const response = await fetch('https://твой-апп.onrender.com/api/upgrade', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_item_id: "1", target_item_id: "2" })
            });
            const data = await response.json();

            // Делаем несколько полных оборотов (например, 5) + угол остановки
            const totalRotation = 360 * 5 + (360 - data.stop_angle);
            const wheel = document.getElementById('wheel');
            
            wheel.style.transform = `rotate(${totalRotation}deg)`;

            setTimeout(() => {
                document.getElementById('result').innerText = data.is_win ? "ВИН! 🎉" : "ЛУЗ! ❌";
            }, 4000);
        }
    </script>
</body>
</html>
