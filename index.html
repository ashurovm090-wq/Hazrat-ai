<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Torch Drop</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #0d0e12; color: #fff; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px 15px 30px; }

        /* Шапка сайта */
        header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; padding: 10px 0 15px; }
        .logo { font-size: 22px; font-weight: 900; letter-spacing: 1.5px; background: linear-gradient(90deg, #ff4e50, #f9d423); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }
        .balance-box { display: flex; align-items: center; background: #16181f; border: 1px solid #272a36; border-radius: 10px; padding: 4px 6px 4px 12px; gap: 8px; }
        .balance-val { font-size: 14px; font-weight: 800; color: #2ed573; }
        .dep-btn { background: linear-gradient(135deg, #ff4e50, #f9d423); color: #000; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 800; font-size: 12px; cursor: pointer; }

        /* Вкладки */
        .tabs { display: flex; width: 100%; max-width: 400px; background: #16181f; border-radius: 10px; padding: 3px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: #717a8a; font-weight: 700; font-size: 13px; border-radius: 8px; cursor: pointer; text-transform: uppercase; }
        .tab-btn.active { background: linear-gradient(135deg, #ff4e50, #f9d423); color: #000; }

        .page { display: none; width: 100%; max-width: 400px; flex-direction: column; align-items: center; }
        .page.active { display: flex; }

        /* Карточки Апгрейда */
        .upgrade-arena { display: flex; justify-content: space-between; width: 100%; gap: 10px; margin-bottom: 10px; }
        .item-card { background: #16181f; border: 1px solid #272a36; border-radius: 14px; padding: 10px; width: 48%; display: flex; flex-direction: column; align-items: center; }
        .item-card.target { border-color: rgba(255, 78, 80, 0.4); }
        .item-card .title { font-size: 10px; color: #717a8a; font-weight: 600; text-transform: uppercase; }
        .item-card .icon { font-size: 22px; margin: 2px 0; }
        .item-card .name { font-size: 11px; font-weight: 700; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .item-card .price { font-size: 13px; font-weight: 800; color: #2ed573; background: rgba(46, 213, 115, 0.1); padding: 2px 6px; border-radius: 6px; margin-top: 4px; }

        /* Рулетка */
        .wheel-wrapper { position: relative; width: 210px; height: 210px; margin: 10px 0; display: flex; align-items: center; justify-content: center; }
        canvas { width: 210px; height: 210px; border-radius: 50%; }
        .wheel-center { position: absolute; width: 120px; height: 120px; background: #0d0e12; border-radius: 50%; border: 3px solid #16181f; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
        .chance-label { font-size: 9px; color: #717a8a; font-weight: 600; text-transform: uppercase; }
        .chance-value { font-size: 22px; font-weight: 900; color: #ff4e50; }
        .pointer { position: absolute; top: -4px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 16px solid #ff4e50; z-index: 10; }

        .spin-btn { width: 100%; padding: 14px; border: none; border-radius: 12px; background: linear-gradient(135deg, #ff4e50, #f9d423); color: #000; font-size: 15px; font-weight: 800; text-transform: uppercase; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 78, 80, 0.3); }
        .spin-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        #result { font-size: 13px; font-weight: 800; height: 18px; margin-bottom: 8px; text-transform: uppercase; }

        /* Сетка скинов */
        .section-title { font-size: 11px; font-weight: 700; color: #717a8a; text-transform: uppercase; margin: 12px 0 6px; width: 100%; }
        .items-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; }
        .grid-item { background: #16181f; border: 1px solid #272a36; border-radius: 8px; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .grid-item.selected { border-color: #ff4e50; background: rgba(255, 78, 80, 0.1); }
        .grid-item .g-icon { font-size: 16px; }
        .grid-item .g-name { font-size: 8px; font-weight: 600; text-align: center; margin: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .grid-item .g-price { font-size: 9px; font-weight: 800; color: #2ed573; }

        /* Модалка пополнения */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal { background: #16181f; border: 1px solid #272a36; border-radius: 16px; padding: 20px; width: 90%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; }
        .modal h2 { font-size: 18px; text-align: center; }
        .dep-input { padding: 12px; background: #0d0e12; border: 1px solid #272a36; border-radius: 8px; color: #fff; font-size: 16px; text-align: center; }
        .modal-btns { display: flex; gap: 10px; }
        .modal-btns button { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .confirm-btn { background: #2ed573; color: #000; }
        .close-btn { background: #ff4757; color: #fff; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🔥 Torch Drop</div>
        <div class="balance-box">
            <span class="balance-val" id="balanceVal">$0.00</span>
            <button class="dep-btn" onclick="openDepModal()">+</button>
        </div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('upgrade')">Апгрейд</button>
        <button class="tab-btn" onclick="switchTab('shop')">Магазин</button>
    </div>

    <!-- Страница Апгрейда -->
    <div class="page active" id="page-upgrade">
        <div class="upgrade-arena">
            <div class="item-card">
                <span class="title">Ваш скин</span>
                <span class="icon" id="uIcon">-</span>
                <span class="name" id="uName">Выберите скин</span>
                <span class="price" id="uPrice">$0</span>
            </div>
            <div class="item-card target">
                <span class="title">Цель</span>
                <span class="icon" id="tIcon">-</span>
                <span class="name" id="tName">Выберите цель</span>
                <span class="price" id="tPrice">$0</span>
            </div>
        </div>

        <div class="wheel-wrapper">
            <div class="pointer"></div>
            <canvas id="wheelCanvas" width="420" height="420"></canvas>
            <div class="wheel-center">
                <span class="chance-label">Шанс</span>
                <span class="chance-value" id="chanceVal">0%</span>
            </div>
        </div>

        <div id="result"></div>
        <button class="spin-btn" id="spinBtn" onclick="spin()">Апгрейд</button>

        <div class="section-title">1. Выберите ваш скин из инвентаря:</div>
        <div class="items-grid" id="userGrid"></div>

        <div class="section-title">2. Выберите желаемую цель:</div>
        <div class="items-grid" id="targetGrid"></div>
    </div>

    <!-- Страница Магазина -->
    <div class="page" id="page-shop">
        <div class="section-title">Купить скин в инвентарь:</div>
        <div class="items-grid" id="shopGrid"></div>
    </div>

    <!-- Модалка пополнения -->
    <div class="modal-overlay" id="depModal">
        <div class="modal">
            <h2>Пополнение баланса</h2>
            <input type="number" class="dep-input" id="depAmount" value="100" placeholder="Сумма в $">
            <div class="modal-btns">
                <button class="confirm-btn" onclick="makeDeposit()">Пополнить</button>
                <button class="close-btn" onclick="closeDepModal()">Отмена</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        
        let state = { balance: 0, user_inventory: [], target_items: [], shop_items: [] };
        let selectedUserItem = null;
        let selectedTargetItem = null;
        let currentRotation = 0;
        let winChance = 0;

        async function init() {
            const res = await fetch('/api/init');
            state = await res.json();
            updateUI();
        }

        function updateUI() {
            document.getElementById('balanceVal').innerText = `$${state.balance.toFixed(2)}`;
            
            if (!selectedUserItem && state.user_inventory.length > 0) selectedUserItem = state.user_inventory[0];
            if (!selectedTargetItem && state.target_items.length > 0) selectedTargetItem = state.target_items[0];

            renderGrid('userGrid', state.user_inventory, 'user');
            renderGrid('targetGrid', state.target_items, 'target');
            renderShopGrid('shopGrid', state.shop_items);
            
            updateSelection();
        }

        function renderGrid(containerId, items, type) {
            const grid = document.getElementById(containerId);
            if (items.length === 0) {
                grid.innerHTML = '<div style="grid-column: span 4; font-size: 11px; color: #717a8a; text-align: center; padding: 10px;">Инвентарь пуст. Купите скин в магазине!</div>';
                return;
            }
            grid.innerHTML = items.map(item => `
                <div class="grid-item" id="${type}-${item.id}" onclick="selectItem('${type}', '${item.id}')">
                    <span class="g-icon">${item.img}</span>
                    <span class="g-name">${item.name}</span>
                    <span class="g-price">$${item.price}</span>
                </div>
            `).join('');
        }

        function renderShopGrid(containerId, items) {
            const grid = document.getElementById(containerId);
            grid.innerHTML = items.map(item => `
                <div class="grid-item" onclick="buyItem('${item.id}')">
                    <span class="g-icon">${item.img}</span>
                    <span class="g-name">${item.name}</span>
                    <span class="g-price">$${item.price}</span>
                </div>
            `).join('');
        }

        function selectItem(type, id) {
            if (type === 'user') selectedUserItem = state.user_inventory.find(i => i.id === id);
            else selectedTargetItem = state.target_items.find(i => i.id === id);
            updateSelection();
        }

        function updateSelection() {
            document.querySelectorAll('.grid-item').forEach(el => el.classList.remove('selected'));
            if(selectedUserItem) document.getElementById(`user-${selectedUserItem.id}`)?.classList.add('selected');
            if(selectedTargetItem) document.getElementById(`target-${selectedTargetItem.id}`)?.classList.add('selected');

            if (selectedUserItem) {
                document.getElementById('uName').innerText = selectedUserItem.name;
                document.getElementById('uPrice').innerText = `$${selectedUserItem.price}`;
                document.getElementById('uIcon').innerText = selectedUserItem.img;
            } else {
                document.getElementById('uName').innerText = 'Нет скина';
                document.getElementById('uPrice').innerText = '$0';
                document.getElementById('uIcon').innerText = '-';
            }

            if (selectedTargetItem) {
                document.getElementById('tName').innerText = selectedTargetItem.name;
                document.getElementById('tPrice').innerText = `$${selectedTargetItem.price}`;
                document.getElementById('tIcon').innerText = selectedTargetItem.img;
            }

            if (selectedUserItem && selectedTargetItem) {
                if (selectedUserItem.price >= selectedTargetItem.price) {
                    winChance = 0;
                    document.getElementById('chanceVal').innerText = '0%';
                    drawWheel(0, 0);
                    document.getElementById('spinBtn').disabled = true;
                } else {
                    winChance = Math.min(((selectedUserItem.price / selectedTargetItem.price) * 100 * 0.95), 80).toFixed(1);
                    document.getElementById('chanceVal').innerText = `${winChance}%`;
                    drawWheel(0, winChance);
                    document.getElementById('spinBtn').disabled = false;
                }
            } else {
                document.getElementById('spinBtn').disabled = true;
                drawWheel(0, 0);
            }
        }

        function drawWheel(rotation = 0, chance = 0) {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const winAngleRad = (chance / 100) * (2 * Math.PI);
            const startAngle = -Math.PI / 2 + rotation;

            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, startAngle, startAngle + winAngleRad);
            ctx.fillStyle = '#ff4e50';
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, startAngle + winAngleRad, startAngle + (2 * Math.PI));
            ctx.fillStyle = '#1b1d26';
            ctx.fill();
        }

        async function spin() {
            if (!selectedUserItem || !selectedTargetItem) return;
            const btn = document.getElementById('spinBtn');
            const resultDiv = document.getElementById('result');
            btn.disabled = true;
            resultDiv.innerText = '';

            const res = await fetch('/api/upgrade', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_item_id: selectedUserItem.id, target_item_id: selectedTargetItem.id })
            });

            const data = await res.json();

            const targetAngleRad = (360 - data.stop_angle) * (Math.PI / 180);
            const totalRotationRad = (5 * 2 * Math.PI) + targetAngleRad;
            const startTime = performance.now();

            function animate(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / 4000, 1);
                const easeProgress = 1 - Math.pow(1 - progress, 3);
                
                currentRotation = totalRotationRad * easeProgress;
                drawWheel(currentRotation, data.win_chance);

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    state.user_inventory = data.user_inventory;
                    selectedUserItem = null;
                    
                    if (data.is_win) {
                        resultDiv.style.color = '#2ed573';
                        resultDiv.innerText = 'Успех! Скин получен 🔥';
                    } else {
                        resultDiv.style.color = '#ff4757';
                        resultDiv.innerText = 'Неудача! Скин сгорел 💀';
                    }
                    updateUI();
                }
            }
            requestAnimationFrame(animate);
        }

        async function buyItem(id) {
            const res = await fetch('/api/buy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ shop_item_id: id })
            });
            const data = await res.json();
            if (data.success) {
                state.balance = data.new_balance;
                state.user_inventory = data.user_inventory;
                updateUI();
                alert('Скин куплен и добавлен в инвентарь!');
            } else {
                alert(data.detail);
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            if (tab === 'upgrade') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('page-upgrade').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('page-shop').classList.add('active');
            }
        }

        function openDepModal() { document.getElementById('depModal').style.display = 'flex'; }
        function closeDepModal() { document.getElementById('depModal').style.display = 'none'; }
        
        async function makeDeposit() {
            const amount = parseFloat(document.getElementById('depAmount').value);
            if (!amount) return;
            const res = await fetch('/api/deposit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ amount })
            });
            const data = await res.json();
            if (data.success) {
                state.balance = data.new_balance;
                updateUI();
                closeDepModal();
            }
        }

        init();
    </script>
</body>
</html>
